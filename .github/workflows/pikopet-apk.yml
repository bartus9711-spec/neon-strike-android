name: Build PikoPet APK
on:
  push:
    branches: [ pikopet-apk-build ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Buduj aplikacje Android
        run: gradle --no-daemon -p pikopet :app:assembleDebug --stacktrace
      - name: Przygotuj APK
        run: cp pikopet/app/build/outputs/apk/debug/app-debug.apk PikoPet_DUO_BT_WiFi.apk
      - name: APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: PikoPet-Duo-1.1-APK
          path: PikoPet_DUO_BT_WiFi.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publiczny instalator w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view pikopet-duo-v1.1 >/dev/null 2>&1; then
            gh release upload pikopet-duo-v1.1 PikoPet_DUO_BT_WiFi.apk --clobber
          else
            gh release create pikopet-duo-v1.1 PikoPet_DUO_BT_WiFi.apk --target "${GITHUB_SHA}" --title "PikoPet Duo 1.1 Bluetooth i Wi-Fi" --notes "Instalator Android (APK). Pikselowy pupil, 32 gatunki, 32 obudowy, zapis offline i powiadomienia systemowe. Odwiedziny na sparowanym Bluetooth lub w tej samej sieci Wi-Fi po kodzie i zgodzie gospodarza. Budowa testowa z podpisem debug."
          fi