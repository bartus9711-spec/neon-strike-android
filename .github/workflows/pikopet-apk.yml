name: Build Tamagotchi 2.7 APK
on:
  push:
    branches: [ pikopet-apk-build ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kontrola składni i zgodności zasobów offline
        run: |
          node --check pikopet/app/src/main/assets/themes.js
          node --check pikopet/app/src/main/assets/games.js
          node --check pikopet/app/src/main/assets/duo.js
          node --check pikopet/app/src/main/assets/navigation.js
          node --check pikopet/app/src/main/assets/challenges.js
          node --check pikopet/app/src/main/assets/motion.js
          node --check pikopet/app/src/main/assets/bluetooth.js
          node --check pikopet/app/src/main/assets/backgrounds.js
          node --check pikopet/app/src/main/assets/holiday-shells.js
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          p=Path('pikopet/app/src/main/assets')
          html=(p/'index.html').read_text()
          assert '<script src="./themes.js"></script>' in html
          assert '<script src="./games.js"></script>' in html
          assert '<script src="./duo.js"></script>' in html
          assert '<script src="./navigation.js"></script>' in html
          assert '<script src="./challenges.js"></script>' in html
          assert '<script src="./motion.js"></script>' in html
          assert '<script src="./bluetooth.js"></script>' in html
          assert '<script src="./backgrounds.js"></script>' in html
          assert '<script src="./holiday-shells.js"></script>' in html
          assert 'stocking' in (p/'backgrounds.js').read_text()
          assert 'window.PikoMotion.cozy' in html
          assert "const defs=[" in (p/'challenges.js').read_text()
          assert 'makeDiscoverable' in (p/'bluetooth.js').read_text()
          assert 'scanBluetooth' in (p/'bluetooth.js').read_text()
          assert 'systemDevicePicker' in (p/'bluetooth.js').read_text()
          assert 'bt_visible' in (p/'bluetooth.js').read_text()
          assert "addEventListener('click',()=>hideSheet())" in html
          assert 'PikoNavigation' in (p/'navigation.js').read_text()
          main=re.search(r'<script>(.*?)</script>',html,re.S).group(1)
          subprocess.run(['node','--check','-'],input=main,text=True,check=True)
          assert 'function renderUI()' in main and 'function showVisits()' in main
          assert 'const profiles=[' in (p/'themes.js').read_text()
          assert 'const classics=THEMES.map' in (p/'themes.js').read_text()
          assert '64 wymienne obudowy' in (p/'themes.js').read_text()
          assert 'const BONUS=[' in (p/'games.js').read_text()
          print('Tamagotchi 2.7: wszystkie skrypty i pliki są dostępne offline')
          PY
      - name: Android SDK 35
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Buduj aplikacje Android
        run: gradle --no-daemon -p pikopet :app:assembleDebug --stacktrace
      - name: Przygotuj APK
        run: cp pikopet/app/build/outputs/apk/debug/app-debug.apk Tamagotchi_Swiateczne_Jajka_2_7.apk
      - name: APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Tamagotchi-Swieta-Tla-2.6-APK
          path: Tamagotchi_Swiateczne_Jajka_2_7.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publiczny instalator w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tamagotchi-holiday-shells-v2.7 >/dev/null 2>&1; then
            gh release upload tamagotchi-holiday-shells-v2.7 Tamagotchi_Swiateczne_Jajka_2_7.apk --clobber
          else
            gh release create tamagotchi-holiday-shells-v2.7 Tamagotchi_Swiateczne_Jajka_2_7.apk --target "${GITHUB_SHA}" --title "Tamagotchi 2.7 — obudowy, minigry i odwiedziny" --notes "Instalator Android (APK). Pikselowy pupil, 64 obudowy (32 klasyczne, 32 nowe Deluxe), 32 gatunki, 20 minigier, 12 zabaw, album pamiątek, zapis offline i przypomnienia o opiece. Ulepszone wykrywanie telefonow, rzeczywiste potwierdzenie widocznosci, skaner systemowy Androida i parowanie BT; Wi-Fi bez zmian. Zwierzaki chodzą po ekranie, po wizycie BT/Wi-Fi pojawia się przytulny pokoik. Można wykryć i sparować telefony Bluetooth. X cofa do poprzedniego menu, Android Wstecz działa tak samo. Budowa testowa z podpisem debug."
          fi