name: TeamCS WebGL QA

on:
  workflow_dispatch:

jobs:
  browser-smoke:
    name: Android UI engine in real Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run desktop and touch Chromium WebGL smoke tests
        run: node tests/teamcs-smoke.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeamCS-QA-Screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
