name: TeamCS Godot APK Installability Validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/godot-android-apk-validation.yml'
jobs:
  validate-native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch existing Godot Android test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42538681151 --repo "$GITHUB_REPOSITORY" -n TeamCS-Godot-GT7-QA -D /tmp/native-qa
          find /tmp/native-qa -type f -printf '%p %s bytes\n'
          APK_PATH=$(find /tmp/native-qa -type f -name TeamCS_Godot_GT7_QA.apk -print -quit)
          test -n "$APK_PATH"
          cp "$APK_PATH" /tmp/TeamCS_Godot_GT7_QA.apk
          test -s /tmp/TeamCS_Godot_GT7_QA.apk
      - name: Cryptographically verify installer signing and manifest
        run: |
          set -euo pipefail
          APK=/tmp/TeamCS_Godot_GT7_QA.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.1"
          if [ ! -x "$TOOLS/apksigner" ]; then
            TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          fi
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:|launchable-activity:)" || true
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/teamcs-manifest.txt
          grep -A 28 -B 6 -E 'GodotAppLauncher|GodotApp|android.intent.category.LAUNCHER|android.intent.action.MAIN' /tmp/teamcs-manifest.txt | head -125
          if ! grep -q "android.intent.category.LAUNCHER" /tmp/teamcs-manifest.txt; then
            echo "Missing Android launcher intent in manifest" >&2
            exit 1
          fi
          "$TOOLS/zipalign" -c -v 4 "$APK"
      - name: Check APK manifest and Godot runtime architecture
        run: |
          set -euo pipefail
          APK=/tmp/TeamCS_Godot_GT7_QA.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump permissions "$APK" || true
          unzip -l "$APK" | grep 'lib/arm64-v8a/libgodot_android.so'
          unzip -p "$APK" classes.dex | strings | grep -m1 -E '(TeamCSNetwork|teamcs)' || true
          echo "APK_STATIC_INSTALL_CHECK_SUCCESS"
