name: TeamCS Godot Android Network Plugin Build
on:
  workflow_dispatch:

jobs:
  build-native-network-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile Godot Android 4.7.2 plugin
        run: gradle -p godot/network-android --no-daemon :network:assembleDebug :network:assembleRelease
      - name: Prepare AARs for future Godot Android export (no game APK)
        run: |
          mkdir -p godot/addons/teamcs_network/bin
          cp godot/network-android/network/build/outputs/aar/network-debug.aar godot/addons/teamcs_network/bin/teamcs-network-debug.aar
          cp godot/network-android/network/build/outputs/aar/network-release.aar godot/addons/teamcs_network/bin/teamcs-network-release.aar
          unzip -l godot/addons/teamcs_network/bin/teamcs-network-debug.aar | grep AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: TeamCS-Godot-Network-Plugin-AAR
          path: godot/addons/teamcs_network/bin/*.aar
          if-no-files-found: error
