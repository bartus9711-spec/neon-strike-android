name: Buduj NEON STRIKE APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ustaw Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sprawdz Android SDK dostepny na serwerze
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Zbuduj APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Przygotuj plik do pobrania
        run: cp app/build/outputs/apk/debug/app-debug.apk NEON_STRIKE_V3.apk
      - name: Udostepnij APK jako artefakt kompilacji
        uses: actions/upload-artifact@v4
        with:
          name: NEON-STRIKE-Android-APK
          path: NEON_STRIKE_V3.apk
          if-no-files-found: error
          retention-days: 14
      - name: Opublikuj bezposredni APK w GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0-beta >/dev/null 2>&1; then
            gh release upload v0.3.0-beta NEON_STRIKE_V3.apk --clobber
          else
            gh release create v0.3.0-beta NEON_STRIKE_V3.apk --target "${GITHUB_SHA}" --title "NEON STRIKE V3 (beta)" --prerelease --notes "NEON STRIKE V3: 8 map, 5 stylizowanych broni, prywatne pokoje online P2P, ranking beta i kosmetyka zdobywana za rozgrywke. Pobierz NEON_STRIKE_V3.apk i otworz go w Plikach na Androidzie. To testowa aplikacja spoza Google Play. Przy zmianie podpisu debug poprzednia wersja moze wymagac odinstalowania."
          fi
