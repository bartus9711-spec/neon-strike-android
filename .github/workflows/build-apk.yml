name: Buduj TeamCS APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ustaw Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sprawdz Android SDK dostepny na serwerze
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Zbuduj APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Przygotuj plik do pobrania
        run: cp app/build/outputs/apk/debug/app-debug.apk TeamCS_Android.apk
      - name: Udostepnij APK jako artefakt kompilacji
        uses: actions/upload-artifact@v4
        with:
          name: TeamCS-Android-APK
          path: TeamCS_Android.apk
          if-no-files-found: error
          retention-days: 14
      # No automatic public release while Godot 3D visuals are below the quality gate.
      - name: Opublikuj bezposredni APK w GitHub Releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view teamcs-v1.0.0-preview >/dev/null 2>&1; then
            gh release upload teamcs-v1.0.0-preview TeamCS_Android.apk --clobber
          else
            gh release create teamcs-v1.0.0-preview TeamCS_Android.apk --target "${GITHUB_SHA}" --title "TeamCS v1.0.0 (preview)" --prerelease --notes "TeamCS preview: 8 autorskich map, postacie zespolow T/CT, drewniane osłony, celowanie przez lunetę z osobną czułością, tryb solo i lobby P2P. Ranking jest lokalny, nie jest globalnym matchmakingiem. Pobierz TeamCS_Android.apk i otworz go w Plikach na Androidzie. To testowa aplikacja spoza Google Play. Przy zmianie podpisu debug poprzednia wersja moze wymagac odinstalowania."
          fi
