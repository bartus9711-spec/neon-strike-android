name: Buduj NEON STRIKE APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ustaw Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sprawdz Android SDK dostepny na serwerze
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Dostepne platformy:"
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "Dostepne build-tools:"
          ls -1 "$ANDROID_HOME/build-tools" || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Zbuduj APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-STRIKE-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
