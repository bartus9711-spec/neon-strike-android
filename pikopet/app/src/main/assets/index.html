/* Tamagotchi 1.1 — jeden, idealnie wyśrodkowany ekran gry, bez górnego i dolnego paska. */
html,body {height:100%;height:100dvh;overflow:hidden;}
.app {height:100dvh;min-height:0;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);}
.topbar,.bottom-hud {display:none!important;}
.play-stage {width:100%;height:100%;min-height:0;min-width:0;flex:1 1 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.egg {width:min(100vw,580px,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 10px) * 0.82317));max-width:100%;height:auto;aspect-ratio:810 / 984;flex:0 0 auto;position:relative;margin:auto;}
.lcd {left:28.1%;top:30.35%;width:51.8%;height:40.45%;}
.view-port canvas {width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
.icon-bar {background:#ffeeddbb;}
.lcd .on-lcd,.lcd .lcd-title {text-shadow:0 1px 1px #fff9;}
@media(max-height:640px){.egg{width:min(100vw,540px,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 6px)*0.82317))}}
@media(min-width:700px){.egg{width:min(580px,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 12px)*0.82317))}}

/* Większa powierzchnia animacji i ostrzejsza grafika LCD. */
.icon-bar{height:17%;}
.view-port{image-rendering:pixelated;}
.lcd{isolation:isolate;}

/* 2.0 — fully contained symmetrical 1122:1402 device, no competing app bars. */
:root{--ink:#fdf3e3}
html,body{width:100%;height:100%;overflow:hidden}
.app{height:100dvh;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at center,#372057 0%,#1e1133 54%,#120b22 94%);}
.play-stage{width:100%;height:100%;min-height:0;max-height:100%;flex:1 1 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 4px}
.egg{box-sizing:border-box;width:min(calc(100vw - 8px),calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 8px)*.800285),640px)!important;height:auto!important;aspect-ratio:1122/1402!important;flex:0 0 auto;max-width:100%;position:relative;margin:auto;filter:drop-shadow(0 16px 26px #0c051cac);transform:none!important}
.egg>img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;border:0;}
.topbar,.bottom-hud{display:none!important}
.shell-shine{background:none!important}
/* New frame opening based on blank original art: inside boundaries, not crossing gold. */
.lcd{left:22.95%!important;top:28.97%!important;width:54.1%!important;height:36.45%!important;overflow:hidden;border-radius:5%;box-shadow:none;background:repeating-linear-gradient(162deg,#f5f9dc 0 25%,#f4e7f7 25% 45%,#e8f5e0 45% 66%,#fff2d3 66% 87%);color:#241a31;isolation:isolate}
.icon-bar{height:16.5%!important;background:linear-gradient(180deg,#fff9dfdf,#f3e2eacc)!important;border-bottom:1px solid #9c8f8a77;min-height:0;padding:1px 2px;gap:0}
.icon-bar.bottom-icons{border:0;border-top:1px solid #9c8f8a77}
.ico{border:1.5px solid transparent;border-radius:4px;width:16.66%;height:98%;padding:1px;min-height:0}
.ico.selected{background:#fff6afeb;border:2px solid #463350;box-shadow:inset 0 0 0 1px #fff1c4}
.ico svg{height:78%;width:88%;stroke-width:2.4}
.view-port{height:auto;flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#f5f8de99,#fff0e199 48%,#e4ebfdb3);overflow:hidden}
.view-port canvas{width:100%;height:100%;object-fit:fill;image-rendering:pixelated!important;image-rendering:crisp-edges!important;}
.lcd-title{bottom:1px!important;font-family:ui-monospace,monospace;font-weight:900;font-size:clamp(8px,1.9vw,12px);letter-spacing:0;line-height:1.2;background:#fff8eabb;border-radius:4px;width:max-content;max-width:98%;padding:1px 5px;margin:auto}
.on-lcd{top:9%;right:5%;font-family:ui-monospace,monospace;font-weight:900;font-size:clamp(9px,2.6vw,16px);color:#6c3d61}
/* The control hits precisely follow the three physical jewel buttons. */
.physical{width:15.5%;height:10.0%;border-radius:50%;background:transparent;outline-offset:-3px;}
.physical.prev{left:30.2%;top:78.75%}
.physical.select{left:49.15%;top:83.3%}
.physical.next{left:67.95%;top:78.75%}
.physical:active,.physical.pressed{background:#fff4ff49;box-shadow:0 0 8px #fbe9fc,inset 0 0 9px #823e8aaa;}
/* Settings lives in the shell's rim; all secondary panels open there. */
.corner-hotspot{z-index:5;display:grid;place-items:center;color:#fff1c3;background:#291442cc;border:1.5px solid #eed69b;box-shadow:0 3px 14px #10071aa9;border-radius:50%;width:9.5%;height:7.6%;font-size:clamp(16px,5vw,25px);line-height:1}
.gear-hotspot{left:auto!important;right:4%;top:13%;}
.book-hotspot{display:none!important}
.overlay[hidden]{display:none!important}
.sheet{max-height:min(91dvh,900px)}
.toast{top:calc(env(safe-area-inset-top,0px) + 12px);max-width:min(90vw,410px)}
@media(max-height:580px){.egg{width:min(calc(100vw - 8px),calc((100dvh - 6px)*.800285))!important;}}

.pixel-thumb{display:block;width:58px;height:58px;max-width:100%;margin:auto;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.reveal-pixel{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(2px 4px 0px #261c3444)}

.pixel-thumb{display:block;width:58px;height:58px;max-width:100%;margin:auto;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.reveal-pixel{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(2px 4px 0px #261c3444)}
</style>
</head>

function localNotify(title,body){
 if(!S.settings.notifications||!('Notification' in window)||Notification.permission!=='granted')return;
 const options={body,tag:'pikopet-'+title,icon:'assets/icon192.png',renotify:false};
 try{
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
   navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,options)).catch(()=>new Notification(title,options));
  }else new Notification(title,options);
 }catch(e){ /* Notifications depend on browser/OS */ }
}

function checkCareAlerts(){

 const now=Date.now();if(!S.alerts)S.alerts={};
 const alerts=[

  ['health',p.health<=30,'❤️ Tamagotchi potrzebuje pomocy!',p.name+' ma mało zdrowia.'],
  ['sick',p.sick,'💊 Tamagotchi zachorował!',p.name+' potrzebuje leczenia.'],
  ['clean',p.clean<=22||p.waste>=80,'🧼 Tamagotchi potrzebuje sprzątania!',p.name+' prosi o czystość.'],
  ['sad',p.happy<=21,'💞 Tamagotchi tęskni!',p.name+' potrzebuje zabawy i uwagi.']
 ];
 for(const [id,active,title,body] of alerts){
  if(!active){delete S.alerts[id];continue}

 }
}

function die(reason='Odszedł spokojnie po swoim czasie.'){const p=S.pet;if(!p||!p.alive)return;p.alive=false;p.deathReason=reason;p.sleeping=false;recordHistory(p,reason);writeJournal(`${p.name}: ${reason}`);save();sound(300,.18);notify(`${p.name} zakończył swoją przygodę. 🕊️`);}
function stage(p){const age=(Date.now()-p.born)/MIN;return age<20?'Maluch':age<150?'Dziecko':age<3*1440?'Dorosły':'Senior'}
function ageLabel(p){let dur=Date.now()-p.born;if(dur<3600000)return Math.floor(dur/MIN)+' min';return Math.floor(dur/3600000)+' godz.'+(dur>=DAY?' / '+Math.floor(dur/DAY)+' dni':'')}
function simulate(){const now=Date.now();let mins=Math.max(0,Math.min(15*24*60,(now-S.lastUpdate)/MIN));if(S.daily.day!==dateKey())S.daily={day:dateKey(),goals:{},claimed:[],foodKinds:[]};if(S.egg&&now>=S.egg.until){hatch();}
 const p=S.pet;
 if(p&&p.alive&&mins>0){const f=S.settings.gentle?.52:1;mins*=f;
  p.hunger=clamp(p.hunger-.18*mins);p.happy=clamp(p.happy-.12*mins);p.clean=clamp(p.clean-.13*mins);p.energy=clamp(p.energy+(p.sleeping?.38:-.12)*mins);p.fullness=clamp(p.fullness-.25*mins,0,160);p.waste=clamp(p.waste+.1*mins,0,100);
  if(!p.sleeping&&p.energy<15)p.happy=clamp(p.happy-.24*mins);
  if(p.sleeping&&p.energy>=95)p.sleeping=false;
  let harm=(p.hunger<14?.38:0)+(p.clean<12?.24:0)+(p.waste>84?.32:0)+(p.sick?.38:0)+(p.fullness>125?.58:0);
  p.health=clamp(p.health+(harm?-harm*mins:.035*mins));
  if(p.hunger<5||p.health<10)p.happy=clamp(p.happy-.3*mins);
  // The risk events are stochastic but never punish a single ordinary feeding.
  if(!p.sick&&Math.random()<Math.min(.5,mins*(p.clean<24?.00085:.00006))) {p.sick=true;writeJournal(`${p.name} zachorował — sprawdź apteczkę.`);}
  if(p.fullness>120&&!p.sick&&Math.random()<Math.min(.9,(p.fullness-110)*mins*.0003)) {p.sick=true;writeJournal(`${p.name} źle się poczuł po przejedzeniu.`);}
  if(p.health<=0){die(p.fullness>120?'Problemy zdrowotne po przejedzeniu.':p.sick?'Choroba okazała się zbyt ciężka.':'Potrzebował więcej opieki.');}
  // Every pet has a unique natural lifespan. Higher care may extend it slightly.
  const ageDays=(now-p.born)/DAY;if(p.alive&&ageDays>=p.lifespan){const chance=Math.min(1,(ageDays-p.lifespan+.1)/1.7);if(Math.random()<chance){die('Dożył spokojnej starości.');}}
  if(p.alive&&ageDays>p.lifespan+2.5)die('Dożył spokojnej starości.');
  if(p.alive){const st=stage(p);if(st!==p.lastStage){p.lastStage=st;writeJournal(`${p.name} osiągnął etap: ${st}.`);if(st==='Dorosły')unlock('adult');if(st==='Senior')unlock('elder');}}
 }
 S.lastUpdate=now;checkCareAlerts();save();renderUI();
}
function hatch(){if(!S.egg||S.pet)return;const type=S.egg.type;const weighted=[];for(const s of SPECIES){let w=({common:8,uncommon:10,rare:7,legend:3.5})[s.tier];if(!S.collection.includes(s.id))w*=3.2;const recent=JSON.parse(localStorage.getItem('tama_recent_hatches_v1')||'[]');if(recent.includes(s.id))w*=.07;if(type==='space'&&['alien','star','slime','ghost','dragon','bat'].includes(s.id))w*=4;if(type==='forest'&&['fox','rabbit','frog','deer','owl','wolf','hedgehog','bear'].includes(s.id))w*=3.8;if(type==='dream'&&['unicorn','phoenix','bee','panda','koala','octopus'].includes(s.id))w*=3.8;weighted.push(w)}
 let total=weighted.reduce((a,b)=>a+b,0),r=Math.random()*total,chosen=SPECIES[0];for(let i=0;i<SPECIES.length;i++){r-=weighted[i];if(r<=0){chosen=SPECIES[i];break}}
 const personality=pick(PERS),name=chosen.name,now=Date.now();
 S.pet={species:chosen.id,name,born:now,alive:true,personality,origin:type,stage:'Maluch',lastStage:'Maluch',lifespan:rand(6,13.5),hunger:76,happy:79,energy:83,clean:87,health:100,affection:50,discipline:40,fullness:14,waste:0,sick:false,sleeping:false,actions:0};S.egg=null;
 const recentHatches=JSON.parse(localStorage.getItem('tama_recent_hatches_v1')||'[]');recentHatches.unshift(chosen.id);localStorage.setItem('tama_recent_hatches_v1',JSON.stringify(recentHatches.slice(0,4)));S.stats.hatches++;if(!S.collection.includes(chosen.id))S.collection.push(chosen.id);unlock('first');if(chosen.tier==='rare')unlock('rare');if(chosen.tier==='legend')unlock('legend');checkAchievements();writeJournal(`Z jajka wykluł się ${name} (${TIERS[chosen.tier]}).`);sound(860,.1);setTimeout(()=>sound(1080,.1),110);save();notify(`🥚 Wykluł się ${chosen.emoji} ${name}!`);
 showHatchReveal(chosen);
}

function renamePet(){const inp=$('petName');if(!inp)return;const name=inp.value.trim().slice(0,18);if(name)S.pet.name=name;writeJournal(`${S.pet.name} ma swój nowy dom.`);save();(window.PikoNavigation?.close||hideSheet)();notify('💞 Opiekuj się '+S.pet.name+'!')}
function ensurePet(){if(S.egg){eggTap();return false}if(!S.pet){showEggPicker();return false}if(!S.pet.alive){showMemorial();return false}return true}
function showMemorial(){const p=S.pet;if(!p||p.alive)return;const s=SPECIES.find(x=>x.id===p.species);showSheet('🌙 Koniec przygody',`<div style="text-align:center;font-size:60px;margin:5px">${s?s.emoji:'🐾'}</div><p style="text-align:center;font-weight:900;font-size:20px;margin:5px">${esc(p.name)}</p><div class="banner" style="text-align:center">${esc(p.deathReason||'Jego przygoda dobiegła końca.')}<p style="margin:9px 0 0">Wspólne chwile: ${esc(ageLabel(p))}</p></div><p class="intro">Odkryte gatunki, osiągnięcia i monety pozostają zachowane. Możesz rozpocząć nową przygodę z kolejnym jajkiem.</p><button class="primary" style="width:100%" data-action="nextlife">🥚 Nowe jajko</button>`,'memorial')}
function spend(n){if(n>S.coins){notify('Brakuje '+(n-S.coins)+' gwiazdek. Zagraj w minigry!');return false}S.coins-=n;return true}
function care(action){if(!ensurePet())return;const p=S.pet;if(p.sleeping&&!['sleep','stats','menu','clean','heal'].includes(action)){notify(`${p.name} śpi. Najpierw go obudź!`);return}p.actions++;S.stats.care++;switch(action){
 case 'cuddle':p.affection=clamp(p.affection+13);p.happy=clamp(p.happy+9);p.energy=clamp(p.energy-1);S.stats.cuddle++;tickGoal('cuddle');writeJournal(`Przytulanie: ${p.name} czuje się kochany.`);notify('💖 +13 miłości!');sound(840);break;
 case 'clean':p.clean=clamp(p.clean+40);p.waste=clamp(p.waste-40);S.stats.clean++;tickGoal('clean');writeJournal('Świeżo posprzątane!');notify('🧹 Błysk i porządek!');sound(560);break;
 case 'toilet':p.waste=clamp(p.waste-55);p.clean=clamp(p.clean+8);p.happy=clamp(p.happy+5);notify('🚽 Gotowe!');sound(640);break;
 case 'sleep':p.sleeping=!p.sleeping;if(p.sleeping){p.energy=clamp(p.energy+5);notify('🌙 Zgaszono światło. Dobranoc!')}else notify('☀️ Dzień dobry!');sound(500);break;
 case 'heal':p.sick=false;p.health=clamp(p.health+24);p.happy=clamp(p.happy-2);tickGoal('heal');notify('💊 Pupil czuje się lepiej!');sound(800);break;
 case 'discipline':p.discipline=clamp(p.discipline+12);p.happy=clamp(p.happy-2);p.affection=clamp(p.affection-1);notify('📚 +12 wychowania');sound(550);break;
 case 'play':p.happy=clamp(p.happy+14);p.energy=clamp(p.energy-8);p.hunger=clamp(p.hunger-4);S.stats.play++;tickGoal('play');notify('🎈 Wesoła zabawa!');sound(900);break;
 default:break;
 }checkAchievements();save();renderUI()}
function feed(foodId){if(!ensurePet())return;const p=S.pet;if(p.sleeping){notify('Najpierw obudź pupila!');return}const f=FOOD.find(x=>x.id===foodId);if(!f)return;if(!spend(f.cost))return;
 p.hunger=clamp(p.hunger+f.sat);p.happy=clamp(p.happy+f.mood);p.fullness=clamp(p.fullness+f.sat,0,160);
 if(!S.daily.foodKinds.includes(f.id)){S.daily.foodKinds.push(f.id);tickGoal('food');}S.stats.feed++;tickGoal('feed');
 if(p.fullness>130){if(Math.random()<.42)p.sick=true;p.health=clamp(p.health-rand(3,12));notify('⚠️ Za dużo jedzenia! Możliwe przejedzenie.');writeJournal(`${p.name} zjadł za dużo. Trzeba uważać.`)}
 else if(p.fullness>95&&Math.random()<.25){p.happy=clamp(p.happy-8);notify('🍽️ Brzuszek jest już pełny!')}
 else notify(`${f.emoji} ${p.name} zjadł: ${f.name}!`);
 sound(680);checkAchievements();save();if(activeModal==='feed'||activeModal==='snack')showFood(activeModal==='snack');else renderUI();
}
function showFood(snack=false){if(!ensurePet())return;const p=S.pet;showSheet(snack?'🍬 Przekąski':'🍴 Karmienie',`<div class="banner">${esc(p.name)} · Głód: <b>${Math.round(p.hunger)}%</b> · Pełny brzuszek: <b>${Math.round(p.fullness)}%</b>${p.fullness>90?' <strong>⚠️ Ostrożnie z kolejnym posiłkiem!</strong>':''}</div><div>${FOOD.filter(f=>snack?f.cost>0:true).map(f=>`<div class="item-row"><div class="item-icon">${f.emoji}</div><div class="item-info"><b>${f.name}</b><small>Sytość +${f.sat}, humor +${f.mood}</small></div><button class="secondary" data-food="${f.id}">${f.cost?f.cost+' ✦':'Gratis'}</button></div>`).join('')}</div><p class="hint">Przekarmienie może spowodować chorobę. Pupil nie powinien jeść bez końca.</p>` ,snack?'snack':'feed')}
function doAction(id){sound(640,.045);vibrate();if(S.egg){eggTap();return}if(!S.pet){showEggPicker();return}if(!S.pet.alive&&id!=='menu'){showMemorial();return}switch(id){case 'feed':case 'snack':showFood(id==='snack');break;case 'games':showGames();break;case 'stats':showStats();break;case 'menu':showMenu();break;default:care(id)}}
function iconSvg(n){return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[n]||ICON_PATHS.heart}</svg>`}
function renderIcons(){for(const [loc,arr] of [['lcdTop',ACTIONS.slice(0,6)],['lcdBottom',ACTIONS.slice(6)]]){$(loc).innerHTML=arr.map(a=>{const i=ACTIONS.indexOf(a);return `<button class="ico ${selected===i?'selected':''}" data-icon="${a.id}" aria-label="${a.name}" title="${a.name}">${iconSvg(a.icon)}</button>`}).join('')}}
function renderUI(){if(!document.getElementById('lcdTop'))return;const p=S.pet;$('egg').style.setProperty('--hue',(THEMES[S.theme]?.hue||0)+'deg');$('egg').style.setProperty('--sat',THEMES[S.theme]?.sat||1);$('egg').style.setProperty('--bright',THEMES[S.theme]?.bright||1);
 $('coinTag').textContent='✦ '+S.coins;$('ageTag').textContent=S.egg?'🥚 Wykluwanie':p?(p.alive?'🐾 '+ageLabel(p):'🌙 Wspomnienia'):'🥚 Nowa przygoda';renderIcons();
 if(S.egg){$('statusText').textContent='Dotknij środkowego przycisku albo ekran, aby ogrzać jajko';$('lcdBubble').textContent='';$('lcdTitle').textContent='Wylęganie '+Math.max(0,Math.ceil((S.egg.until-Date.now())/1000))+'s';}
 else if(!p){$('statusText').textContent='Wybierz jajko, aby odkryć pierwszego zwierzaka!';$('lcdBubble').textContent='?';$('lcdTitle').textContent='Wybierz jajko';}
 else if(!p.alive){$('statusText').textContent=`${p.name} · zakończył swoją przygodę`; $('lcdBubble').textContent='♡';$('lcdTitle').textContent='NOWE JAJKO?';}
 else{$('statusText').textContent=`${p.name} · ${stage(p)} · ${p.sick?'🤒 Choruje':p.sleeping?'🌙 Śpi':p.hunger<25?'🍴 Głodny':p.happy<25?'😢 Smutny':p.fullness>100?'🍽️ Najedzony':'💖 Szczęśliwy'}`;
 $('lcdBubble').textContent=p.sick?'!':p.sleeping?'Zz':p.happy>70?'♥':p.hunger<20?'🍴':'';
 $('lcdTitle').textContent=selected>=0?ACTIONS[selected].name:'';}
}
function pushButton(which){if(which==='prev')selected=(selected+ACTIONS.length-1)%ACTIONS.length;else if(which==='next')selected=(selected+1)%ACTIONS.length;else doAction(ACTIONS[selected].id);if(which!=='select'){sound(600,.045);renderUI()}const el=$(which==='prev'?'prevBtn':which==='next'?'nextBtn':'selectBtn');el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),130)}
function showMenu(){const cards=[['📡','Odwiedziny','visits'],['🎨','Obudowy','themes'],['📖','Kolekcja','collection'],['❤️','Stan pupila','stats'],['🎮','Minigry','games'],['🛒','Sklepik','shop'],['🎯','Zadania','tasks'],['🏆','Osiągnięcia','achievements'],['📜','Dziennik','journal'],['⚙️','Ustawienia','settings'],['🥚','Historia pokoleń','history']];showSheet('☰ Menu Tamagotchi',`<p class="intro">Wybierz funkcję. Obudowy zmienisz w każdej chwili — pupil zostaje ten sam.</p><div class="menu-grid">${cards.map(([ico,name,act])=>`<button class="menu-card" data-go="${act}"><span class="emoji">${ico}</span>${name}</button>`).join('')}</div><p class="foot-line">Tamagotchi • gra offline • 100% fikcyjna zabawa</p>`,'menu')}
function showThemes(){showSheet('🎨 Wymienne obudowy',`<p class="intro">Wszystkie <strong>${THEMES.length} obudowy</strong> są od razu dostępne! Zmieniaj je kiedy chcesz — nie tracisz zwierzaka ani postępów.</p><div class="skin-grid">${THEMES.map((t,i)=>`<button class="skin-tile ${S.theme===i?'active':''}" data-theme="${i}"><img src="${SHELL_SRC}" alt="Obudowa ${esc(t.name)}" loading="lazy" style="filter:hue-rotate(${t.hue}deg) saturate(${t.sat}) brightness(${t.bright})"><span>${i+1}. ${esc(t.name)}</span></button>`).join('')}</div>`,'themes')}
function changeTheme(i){S.theme=clamp(i,0,THEMES.length-1);save();sound(950,.07);showThemes();notify('✨ Obudowa: '+THEMES[S.theme].name)}
function showCollection(){showSheet('📖 Kolekcja zwierzaków',`<div class="banner">Odkryto: <strong>${S.collection.length} / ${SPECIES.length}</strong> gatunków. Każde jajko to losowanie — rzadkich pupili spotyka się trudniej.</div><div class="collection-grid">${SPECIES.map(s=>{const found=S.collection.includes(s.id);return `<div class="pet-tile ${found?'found':''}"><span class="pet-emoji">${found?`<img class="pixel-thumb" alt="${esc(s.name)}" src="${SPRITES[s.id].src}">`:'❔'}</span><span class="pet-label">${found?esc(s.name):'???'}</span><span class="rarity">${TIERS[s.tier]}</span></div>`}).join('')}</div><p class="hint">48 gatunków, większa szansa na nieodkryte zwierzaki i mniej powtórek. Wylęganie jest losowe, a gatunki różnią się wyglądem i osobowością.</p>`,'collection')}
function showStats(){if(!ensurePet())return;const p=S.pet;const fields=[['Głód','hunger'],['Humor','happy'],['Energia','energy'],['Czystość','clean'],['Zdrowie','health'],['Miłość','affection'],['Dyscyplina','discipline']];const s=SPECIES.find(x=>x.id===p.species);showSheet('❤️ Stan pupila',`<div class="banner" style="text-align:center"><span style="font-size:35px">${s?.emoji||'🐾'}</span><br><strong>${esc(p.name)}</strong> · ${esc(stage(p))}<br><small>${TIERS[s.tier]} · ${esc(p.personality)} · ${ageLabel(p)}</small></div>${fields.map(([label,key])=>`<div class="stat-row"><span>${label}</span><div class="stat-track"><div class="stat-fill ${p[key]<25?'low':''}" style="width:${Math.round(p[key])}%"></div></div><strong>${Math.round(p[key])}</strong></div>`).join('')}<div class="little-list"><span class="pill">🍽️ Sytość: ${Math.round(p.fullness)}</span><span class="pill">🚽 Toaleta: ${Math.round(p.waste)}</span><span class="pill">🩺 ${p.sick?'Chory':'Zdrowy'}</span><span class="pill">${p.sleeping?'🌙 Śpi':'☀️ Nie śpi'}</span></div><p class="hint">Pełny brzuszek powyżej 100 to sygnał, by zrobić przerwę w karmieniu. Dobre warunki wpływają na zdrowie i dorastanie.</p>`,'stats')}

 const available=!!window.PikoNative || (('Notification' in window) && window.isSecureContext);
 showSheet('⚙️ Ustawienia i menu',`<div class="banner"><strong>${status}</strong><br>✦ ${S.coins} gwiazdek · ${S.collection.length}/32 odkrytych zwierzaków</div>
 <div class="action-list"><button class="primary" data-go="visits">📡 Odwiedziny BT / Wi-Fi</button><button class="primary" data-go="stats">♡ Stan zwierzaka</button><button class="primary" data-go="menu">☰ Pełne menu</button><button class="secondary" data-go="themes">🎨 32 obudowy</button><button class="secondary" data-go="collection">📖 Kolekcja</button></div>
 <div class="section-label">🔔 Przypomnienia o potrzebach</div>
 <div class="settings-row"><strong>Powiadomienia o głodzie, chorobie i czystości</strong><button class="toggle ${S.settings.notifications?'on':''}" data-action="notifications">${S.settings.notifications?'WŁ.':'WŁĄCZ'}</button></div>
 <p class="hint">${available?'Powiadomienia mogą pojawiać się, gdy aplikacja działa w przeglądarce lub tle.':'W pojedynczym pliku HTML powiadomienia systemowe mogą być niedostępne. Zainstalowana PWA z HTTPS oferuje lepszą obsługę.'} W aplikacji Android przypomnienia mogą działać także po zamknięciu gry. System oszczędzania baterii może je opóźniać.</p>
 <div class="section-label">🎛️ Opcje gry</div>
 ${[['sound','🔊 Dźwięki retro'],['vibrate','📳 Wibracje przycisków'],['gentle','🍀 Spokojniejsze tempo życia']].map(([key,label])=>`<div class="settings-row"><strong>${label}</strong><button class="toggle ${S.settings[key]?'on':''}" data-toggle="${key}">${S.settings[key]?'WŁ.':'WYŁ.'}</button></div>`).join('')}
 <div class="section-label">💾 Postępy</div><div class="action-list"><button class="secondary" data-action="export">💾 Eksport zapisu</button><button class="secondary" data-action="import">📥 Import zapisu</button></div>
 <input id="importFile" type="file" accept="application/json,.json" hidden><div class="save-box">Dane zapisują się lokalnie na tym urządzeniu. Eksport zapisu pozwala przenieść pupila do nowej wersji pliku.</div>
 <p class="hint">Tamagotchi jest nieoficjalną grą inspirowaną klasycznymi wirtualnymi zwierzakami.</p>`,'settings')

/* Tamagotchi nearby visits — Android Bluetooth Classic and local Wi-Fi */
const LINK={state:"idle",role:"",other:null,ip:"",pin:"",status:"",paired:[],plays:0,started:0};
function linkNative(){return typeof window.PikoLinkNative!=="undefined";}
function syncVisitPet(){
 if(!linkNative())return;
 try{PikoLinkNative.setPet(JSON.stringify(S.pet&&S.pet.alive?{species:S.pet.species,name:S.pet.name}:{species:"",name:""}));}catch(e){}
}
function showVisits(){
 if(!linkNative()){
   showSheet("📡 Odwiedziny",'<p class="intro">Spotkania Bluetooth i Wi-Fi działają w zainstalowanej aplikacji Android Tamagotchi. Wersja HTML służy do gry offline.</p>','visit');return;
 }
 let html='<p class="intro">Dwa telefony, dwa Tamagotchi. Gospodarz zaprasza pupila do swojego jajka. Bez kont i bez internetu — potrzebna jest ta sama sieć Wi-Fi lub wcześniejsze sparowanie Bluetooth.</p>';
 if(LINK.status)html+='<div class="banner">'+esc(LINK.status)+'</div>';
 if(LINK.state==="invite"){
   html+='<div class="banner"><strong>🐾 '+esc(LINK.other?.name||"Pupil")+'</strong> chce wejść do Twojego domku. Czy zapraszasz go do zabawy?</div><div class="action-list"><button class="primary" data-link="accept">✅ Wpuść pupila</button><button class="secondary" data-link="reject">Nie teraz</button></div>';
 }else if(LINK.state==="visit"){
   const visitor=LINK.other||{};
   let pic=SPRITES[visitor.species]?.src||"";
   html+='<div class="banner" style="text-align:center"><div style="display:flex;gap:16px;justify-content:center;align-items:center">'+
      (S.pet?'<img class="reveal-pixel" style="width:90px;height:90px" src="'+esc(SPRITES[S.pet.species]?.src||"")+'">':'')+
      '<span style="font-size:28px">💞</span>'+
      (pic?'<img class="reveal-pixel" style="width:90px;height:90px" src="'+esc(pic)+'">':'')+
      '</div><strong>'+esc(S.pet?.name||"Twój pupil")+' i '+esc(visitor.name||"Gość")+'</strong><br>'+
      (LINK.role==="host"?"Gość jest w Twoim jajku!":"Twój pupil wybrał się w odwiedziny!")+
      '</div><div class="action-list"><button class="primary" data-link="play">🎾 Wspólna zabawa (+12 humoru)</button><button class="secondary" data-link="bye">🏠 Powrót do domku</button></div><p class="hint">Wspólna zabawa ma krótką przerwę. Każdy pupil zachowuje swój zapis na własnym telefonie.</p>';
 }else{
   if(LINK.state==="hosting"){
     html+='<div class="banner">⏳ Domek otwarty. Czekam na drugiego Tamagotchi.</div>';
     if(LINK.ip)html+='<div class="banner"><strong>Twoje Wi-Fi:</strong><br><strong style="font-size:19px">'+esc(LINK.ip)+'</strong><br>Kod wizyty: <strong style="font-size:26px;letter-spacing:4px">'+esc(LINK.pin)+'</strong></div>';
     html+='<div class="action-list"><button class="secondary" data-link="bye">❌ Zamknij domek</button></div>';
   }else{
     html+='<div class="section-label">📶 Wi-Fi / hotspot — bez internetu</div>'+
       '<p class="hint">Połącz oba telefony z tą samą siecią Wi-Fi. Jeden otwiera domek, drugi wpisuje adres i kod pokazany u gospodarza.</p>'+
       '<div class="action-list"><button class="primary" data-link="hostWifi">🏠 Otwórz domek Wi-Fi</button></div>'+
       '<div class="settings-row"><input id="linkIp" type="text" inputmode="decimal" placeholder="Adres gospodarza np. 192.168.1.5" style="width:100%;min-width:0;font-size:15px;padding:12px;border-radius:12px"></div>'+
       '<div class="settings-row"><input id="linkPin" type="text" inputmode="numeric" maxlength="6" placeholder="Kod 6 cyfr" style="width:100%;font-size:17px;padding:12px;border-radius:12px"></div>'+
       '<div class="action-list"><button class="primary" data-link="joinWifi">🚀 Wyślij pupila przez Wi-Fi</button></div>'+
       '<div class="section-label">🔵 Bluetooth — sparowane telefony</div>'+
       '<p class="hint">Najpierw sparuj telefony w systemowych ustawieniach Bluetooth. Jeden czeka w domku, a drugi wybiera go z listy.</p>'+
       '<div class="action-list"><button class="secondary" data-link="hostBt">🏠 Otwórz domek Bluetooth</button><button class="secondary" data-link="listBt">📱 Pokaż sparowane telefony</button></div>';
     for(const d of LINK.paired){html+='<div class="action-list"><button class="primary" data-link="joinBt" data-bt="'+esc(d.address)+'">🔗 '+esc(d.name||"Telefon")+'</button></div>';}
   }
 }
 showSheet("📡 Odwiedziny",html,"visit");
}
function linkAction(btn){
 if(!linkNative()){notify("Zainstaluj APK na Androidzie.");return;}
 const cmd=btn.dataset.link;
 if(!S.pet?.alive){notify("Najpierw wykluj zdrowego pupila.");return;}
 syncVisitPet();
 try{
  if(cmd==="hostWifi"){LINK.ip="";LINK.pin="";LINK.status="Otwieram domek Wi-Fi…";LINK.state="hosting";PikoLinkNative.hostWifi();}
  else if(cmd==="joinWifi"){
   const ip=($("linkIp")?.value||"").trim(),pin=($("linkPin")?.value||"").trim();
   if(!ip||!pin){notify("Wpisz adres IP i 6-cyfrowy kod.");return;}
   LINK.status="Łączę z gospodarzem Wi-Fi…";LINK.state="waiting";
   PikoLinkNative.joinWifi(ip,pin);
  }else if(cmd==="hostBt"){LINK.ip="";LINK.pin="";LINK.state="hosting";LINK.status="Otwieram domek Bluetooth…";PikoLinkNative.hostBluetooth();}
  else if(cmd==="listBt"){LINK.paired=JSON.parse(PikoLinkNative.pairedBluetooth()||"[]");LINK.status=LINK.paired.length?"Wybierz urządzenie poniżej.":"Brak sparowanych urządzeń. Sparuj telefony w ustawieniach Bluetooth.";}
  else if(cmd==="joinBt"){LINK.status="Łączę przez Bluetooth…";LINK.state="waiting";PikoLinkNative.joinBluetooth(btn.dataset.bt);}
  else if(cmd==="accept"){PikoLinkNative.accept();LINK.status="Gość przyjęty!";}
  else if(cmd==="reject"){PikoLinkNative.reject();LINK.state="idle";LINK.status="Odrzucono wizytę.";}
  else if(cmd==="play"){PikoLinkNative.play();return;}
  else if(cmd==="bye"){PikoLinkNative.endVisit();LINK.state="idle";LINK.other=null;LINK.status="Wróciliście do swoich domków.";}
  showVisits();
 }catch(e){notify("Nie udało się uruchomić połączenia.");}
}
window.PikoLink={receive:function(raw){
 let e;try{e=JSON.parse(raw);}catch(err){return;}
 if(e.type==="wifi_host"){LINK.state="hosting";LINK.ip=e.ip||"";LINK.pin=e.pin||"";LINK.status="Przekaż znajomemu adres i kod wizyty.";}
 else if(e.type==="status"){LINK.status=e.message||"";notify(LINK.status);if(LINK.state==="waiting"&&/nie można|Odrzucono|nie udało/i.test(LINK.status))LINK.state="idle";}
 else if(e.type==="invite"){LINK.state="invite";LINK.other=e.pet||null;LINK.status="Nowy pupil prosi o wizytę!";notify("🐾 Ktoś puka do domku!");}
 else if(e.type==="visit"){LINK.state="visit";LINK.role=e.role||"";LINK.other=e.pet||null;LINK.plays=0;LINK.status="Wizyta rozpoczęta!";notify("💞 Zwierzaki są razem!");}
 else if(e.type==="play"){if(LINK.state==="visit"&&S.pet?.alive){S.pet.happy=clamp(S.pet.happy+12);S.pet.affection=clamp(S.pet.affection+3);S.stats.play++;writeJournal("Wspólna zabawa z pupilem podczas wizyty.");save();LINK.plays++;notify("🎾 Zabawa! +12 humoru");}}
 else if(e.type==="ended"){LINK.state="idle";LINK.role="";LINK.other=null;LINK.ip="";LINK.pin="";LINK.status="Wizyta zakończona. Zwierzak wrócił do swojego jajka.";notify("🏠 Pupil wrócił do domku.");}
 if(activeModal==="visit")showVisits();
 renderUI();
}};

function showHistory(){showSheet('🥚 Historia pokoleń',`<div class="banner">Wyklutych pupili: <b>${S.stats.hatches}</b><br>Odkrytych gatunków: <b>${S.collection.length}</b></div>${S.history.length?S.history.map(h=>`<div class="record-row"><b>${esc(h.name)}</b> · ${new Date(h.day).toLocaleDateString('pl-PL')}<br><small>${esc(h.reason)} · ${Math.floor(h.life/3600000)} godz.</small></div>`).join(''):'<p class="intro">Pierwsza przygoda dopiero się zaczyna. Tutaj zapiszą się wspomnienia z kolejnych pokoleń.</p>'}`,'history')}
function showJournal(){showSheet('📜 Dziennik zdarzeń',`<p class="intro">Losowe wydarzenia, etapy życia i osiągnięcia.</p>${S.journal.length?S.journal.map(x=>`<div class="record-row"><small>${new Date(x.t).toLocaleString('pl-PL')}</small><br>${esc(x.msg)}</div>`).join(''):'<p>Jeszcze nie ma wpisów.</p>'}`,'journal')}
function showAchievements(){showSheet('🏆 Osiągnięcia',`<div class="banner">Ukończono <b>${S.achievements.length} / ${ACHIEVEMENTS.length}</b> osiągnięć.</div><div class="collection-grid">${ACHIEVEMENTS.map(a=>`<div class="pet-tile ${S.achievements.includes(a[0])?'found':''}"><span class="pet-emoji">${S.achievements.includes(a[0])?a[2]:'🔒'}</span><span class="pet-label">${esc(a[1])}</span></div>`).join('')}</div>`,'achievements')}
function showTasks(){if(S.daily.day!==dateKey())S.daily={day:dateKey(),goals:{},claimed:[],foodKinds:[]};const dayIndex=new Date(S.daily.day+'T12:00:00').getDate();const dailyTasks=[TASKS[dayIndex%TASKS.length],TASKS[(dayIndex+2)%TASKS.length],TASKS[(dayIndex+4)%TASKS.length]];showSheet('🎯 Codzienne zadania',`<p class="intro">Zadbaj o pupila i zdobądź darmowe gwiazdki. Zadania zmieniają się codziennie.</p>${dailyTasks.map(t=>{let count=Math.min(t.goal,S.daily.goals[t.id]||0),done=S.daily.claimed.includes(t.id);return `<div class="task-row"><div class="task-main"><b>${esc(t.desc)}</b><small>${count}/${t.goal} · nagroda ${t.reward} ✦</small></div><button class="${count>=t.goal&&!done?'primary':'secondary'}" data-claim="${t.id}" ${count<t.goal||done?'disabled':''}>${done?'✓ Gotowe':'Odbierz'}</button></div>`}).join('')}<p class="hint">Działania naliczają się w trakcie normalnej opieki. Monety można też zdobywać w minigrach.</p>`,'tasks')}
function claimTask(id){const t=TASKS.find(t=>t.id===id);if(!t||S.daily.claimed.includes(id)||(S.daily.goals[id]||0)<t.goal)return;S.daily.claimed.push(id);gainCoins(t.reward);checkAchievements();notify('✦ +'+t.reward+' gwiazdek!');showTasks()}
function showShop(){showSheet('🛒 Sklepik z prezentami',`<div class="banner">Twoje gwiazdki: <strong>✦ ${S.coins}</strong>. Gra nie ma prawdziwych pieniędzy ani płatności.</div>${SHOP.map(i=>`<div class="item-row"><span class="item-icon">${i.emoji}</span><div class="item-info"><b>${esc(i.name)}</b><small>${i.desc} · w plecaku: ${S.inventory[i.id]||0}</small></div><button class="secondary" data-buy="${i.id}">${i.cost} ✦</button></div>`).join('')}<button class="primary" style="margin-top:15px;width:100%" data-go="bag">🎒 Otwórz plecak</button>`,'shop')}
function buyItem(id){const item=SHOP.find(i=>i.id===id);if(!item||!spend(item.cost))return;S.inventory[id]=(S.inventory[id]||0)+1;save();notify(`${item.emoji} Kupiono: ${item.name}`);showShop()}
function showBag(){showSheet('🎒 Plecak',`<p class="intro">Zakupione przedmioty użyj na swoim pupilu.</p>${SHOP.filter(x=>S.inventory[x.id]>0).length?SHOP.filter(x=>S.inventory[x.id]>0).map(i=>`<div class="item-row"><span class="item-icon">${i.emoji}</span><div class="item-info"><b>${i.name}</b><small>Masz: ${S.inventory[i.id]}</small></div><button class="secondary" data-use="${i.id}">Użyj</button></div>`).join(''):'<div class="banner">Plecak jest pusty! Kup prezent w sklepiku.</div>'}<button class="secondary" data-go="shop" style="width:100%;margin-top:12px">🛒 Sklepik</button>`,'bag')}
function useItem(id){if(!ensurePet())return;const item=SHOP.find(x=>x.id===id),p=S.pet;if(!item||!(S.inventory[id]>0))return;S.inventory[id]--;if(item.kind==='toy'){p.happy=clamp(p.happy+(id==='bubble'?15:id==='ball'?24:30));p.affection=clamp(p.affection+(id==='bear'?5:2));tickGoal('play')}else if(item.kind==='care'){p.clean=clamp(p.clean+50);tickGoal('clean')}else {p.health=clamp(p.health+(id==='vitamin'?50:35));p.sick=false;tickGoal('heal')}S.stats.care++;checkAchievements();save();notify('✨ '+item.name+' zadziałało!');showBag()}
function downloadSave(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Tamagotchi_zapis_'+dateKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('💾 Eksport zapisu rozpoczęty!')}
function importSave(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(v.version!==7||typeof v.coins!=='number'||!Array.isArray(v.collection))throw Error('Zły format');S={...defaultState(),...v};S.lastUpdate=Date.now();save();(window.PikoNavigation?.close||hideSheet)();renderUI();notify('✅ Zapis przywrócony!')}catch(e){notify('❌ To nie jest prawidłowy zapis Tamagotchi.')}};reader.readAsText(file)}
/* Mini-games — real interactive rounds, prizes earned without wagers. */
function showGames(){if(!ensurePet())return;showSheet('🎮 Minigry',`<p class="intro">Zagraj z pupilem, popraw mu humor i zdobywaj gwiazdki. Każda gra działa bez internetu!</p><div class="menu-grid"><button class="menu-card" data-game="catch"><span class="emoji">🌟</span>Łap gwiazdki<small class="mini">12 sekund</small></button><button class="menu-card" data-game="memory"><span class="emoji">🧠</span>Pamięć<small class="mini">Powtórz kolory</small></button><button class="menu-card" data-game="rps"><span class="emoji">✂️</span>Trzy gesty<small class="mini">Pupil wybiera</small></button><button class="menu-card" data-game="reflex"><span class="emoji">⚡</span>Refleks<small class="mini">Kliknij na czas</small></button></div>`,'games')}
function startGame(kind){if(!ensurePet())return;gameSession={kind,done:false,started:Date.now(),score:0};switch(kind){
 case 'catch':showSheet('🌟 Łap gwiazdki',`<p class="intro">Dotykaj gwiazdek, zanim uciekną. Masz 12 sekund!</p><div class="banner" id="gameScore">Punkty: <b>0</b> · Czas: <b>12s</b></div><div id="catchBoard" class="game-board"><button class="star-target" id="starTarget">⭐</button></div><button class="secondary" data-go="games" style="width:100%">Zakończ grę</button>`,'game');moveStar();break;
 case 'memory':{const len=4;gameSession.seq=Array.from({length:len},()=>Math.floor(Math.random()*4));gameSession.index=0;gameSession.canTap=false;showSheet('🧠 Gra pamięci',`<p class="intro">Zapamiętaj kolejność migających pól, a potem ją powtórz.</p><div class="banner" id="memoryInfo">Patrz uważnie na kolory!</div><div class="game-pads">${['💜','💚','💛','💙'].map((x,i)=>`<button class="game-pad" data-pad="${i}">${x}</button>`).join('')}</div><button class="secondary" data-go="games" style="width:100%;margin-top:15px">Wróć do gier</button>`,'game');setTimeout(()=>playMemorySequence(),950);break;}
 case 'rps':showSheet('✂️ Trzy gesty',`<p class="intro">Wybierz gest. Pupil wybierze jednocześnie — zwycięstwo daje więcej gwiazdek.</p><div class="banner" id="rpsInfo">Twój ruch!</div><div class="egg-choices">${[['rock','✊','Kamień'],['paper','✋','Papier'],['scissors','✌️','Nożyce']].map(([id,e,n])=>`<button class="egg-choice" data-rps="${id}"><b>${e}</b>${n}</button>`).join('')}</div>`,'game');break;
 case 'reflex':showSheet('⚡ Szybki refleks',`<p class="intro">Poczekaj, aż pojawi się zielony sygnał. Nie klikaj wcześniej!</p><div class="banner" id="reflexInfo">Przygotuj się...</div><div class="game-board" id="reflexBoard"><button class="primary" id="reflexBtn" style="width:72%;height:90px;font-size:23px">CZEKAJ…</button></div>`,'game');gameSession.readyAt=Date.now()+rand(1100,3300);setTimeout(()=>{if(gameSession?.kind==='reflex'&&!gameSession.done&&activeModal==='game'){$('reflexBtn').textContent='⚡ TERAZ!';$('reflexBtn').style.background='#c1ffc3';$('reflexInfo').textContent='Kliknij teraz!';gameSession.litAt=Date.now()}},gameSession.readyAt-Date.now());break;
 }
}
function moveStar(){if(gameSession?.kind!=='catch'||!$('starTarget'))return;const b=$('catchBoard'),el=$('starTarget'),w=b.clientWidth-65,h=b.clientHeight-65;el.style.left=(8+Math.random()*Math.max(5,w-8))+'px';el.style.top=(8+Math.random()*Math.max(5,h-8))+'px'}
function catchStar(){if(!gameSession||gameSession.kind!=='catch'||gameSession.done)return;if(Date.now()-gameSession.started>12000){finishGame(gameSession.score,'Czas minął!');return}gameSession.score++;sound(700+gameSession.score*35,.045);moveStar();if(gameSession.score>=15)finishGame(15,'Wszystkie gwiazdki zebrane!')}
function playMemorySequence(){const g=gameSession;if(!g||g.kind!=='memory'||g.done||activeModal!=='game')return;g.canTap=false;let idx=0;const next=()=>{if(gameSession!==g||activeModal!=='game')return;if(idx>=g.seq.length){g.canTap=true;$('memoryInfo').textContent='Teraz Twoja kolej! · 0/'+g.seq.length;return}let pad=document.querySelector(`[data-pad="${g.seq[idx]}"]`);if(pad){pad.classList.add('lit');sound(450+g.seq[idx]*120,.13);setTimeout(()=>pad.classList.remove('lit'),340)}idx++;setTimeout(next,620)};next()}
function memoryTap(i){const g=gameSession;if(!g||g.kind!=='memory'||g.done||!g.canTap)return;sound(450+i*120,.08);if(g.seq[g.index]===i){g.index++;$('memoryInfo').textContent='Świetnie! · '+g.index+'/'+g.seq.length;if(g.index===g.seq.length)finishGame(15,'Cała sekwencja zapamiętana!')}else finishGame(3,'Pomyłka, ale pupil docenia próbę!')}
function playRps(move){const g=gameSession;if(!g||g.kind!=='rps'||g.done)return;const opts=['rock','paper','scissors'],other=pick(opts),win=(move==='rock'&&other==='scissors')||(move==='paper'&&other==='rock')||(move==='scissors'&&other==='paper');const tie=move===other;const names={rock:'✊ Kamień',paper:'✋ Papier',scissors:'✌️ Nożyce'};$('rpsInfo').innerHTML=`Ty: <b>${names[move]}</b><br>Pupil: <b>${names[other]}</b>`;finishGame(win?13:tie?7:4,win?'Wygrałeś rundę!':tie?'Remis!':'Tym razem wygrał pupil!')}
function reflexTap(){const g=gameSession;if(!g||g.kind!=='reflex'||g.done)return;if(!g.litAt){finishGame(0,'Za wcześnie! Spróbuj jeszcze raz.');return}const ms=Date.now()-g.litAt;finishGame(ms<400?17:ms<700?13:ms<1200?8:3,`Reakcja: ${ms} ms`)}
function finishGame(points,message){const g=gameSession;if(!g||g.done)return;g.done=true;S.stats.games++;tickGoal('games');if(S.pet&&S.pet.alive){S.pet.happy=clamp(S.pet.happy+(points>=10?14:7));S.pet.energy=clamp(S.pet.energy-5)}gainCoins(points);checkAchievements();save();sound(points>=10?1000:650,.12);gameSession=null;showSheet('🎉 Koniec minigry',`<div style="text-align:center;font-size:62px;padding:7px">${points>=10?'🏆':'🎈'}</div><div class="banner" style="text-align:center"><b>${esc(message)}</b><p>Zdobywasz <strong>✦ ${points} gwiazdek</strong></p></div><div class="action-list"><button class="primary" data-go="games">🎮 Jeszcze raz</button><button class="secondary" data-action="close">🥚 Do pupila</button></div>`,'result')}
/* Tamagotchi 2.0 — individually illustrated 48px retro sprites, no blurry silhouettes. */
const CV=$('petCanvas'),ctx=CV.getContext('2d');ctx.imageSmoothingEnabled=false;
const INK='#241a30',PINK='#d782aa';
const SPRITES={};
const PET_FILES=["cat", "dog", "rabbit", "hamster", "chick", "frog", "bear", "mouse", "penguin", "turtle", "owl", "fox", "panda", "koala", "sheep", "deer", "hedgehog", "duck", "wolf", "bat", "axolotl", "bee", "dino", "dragon", "ghost", "octopus", "alien", "seal", "unicorn", "star", "slime", "phoenix"];
for(const id of PET_FILES){const img=new Image();img.src=SPRITE_DATA[id];img.onload=()=>draw();SPRITES[id]=img;}
function px(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function pixelHeart(x,y,col='#bf6e93'){px(x,y,3,2,col);px(x+4,y,3,2,col);px(x-1,y+2,9,3,col);px(x,y+5,7,2,col);px(x+1,y+7,5,1,col);px(x+3,y+8,1,1,col)}
function eggDraw(){
 const palette=({forest:['#e9f2bd','#76ba8f'],space:['#e4dafa','#8f78c8'],dream:['#fff0bd','#ed9bc3']})[S.egg?.type]||['#fff2c0','#ddb6e6'];
 let y=Math.round(Math.sin(frame*.24)*2);
 // Stylized crunchy 8-bit egg: well-defined cracked border and simple shell highlights.
 ctx.save();ctx.translate(0,y);
 ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(48,33,23,26,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=palette[0];ctx.beginPath();ctx.ellipse(48,33,20,23,0,0,Math.PI*2);ctx.fill();
 px(32,25,7,4,'#ffffffb8');px(34,19,4,3,'#ffffffb8');
 px(38,38,20,3,palette[1]);px(35,41,10,3,palette[1]);px(50,42,11,3,palette[1]);
 px(42,16,6,3,palette[1]);px(53,26,5,5,palette[1]);
 if(S.egg&&S.egg.until-Date.now()<8000){
  for(const [x,y] of [[49,12],[46,16],[51,20],[45,24],[49,27],[43,32],[47,35],[44,38]])px(x,y,4,2,INK);
 }
 ctx.restore();
}
function draw(){
 if(!ctx)return;frame++;ctx.clearRect(0,0,96,66);ctx.imageSmoothingEnabled=false;
 // Tiny landscape occupies only bottom; give the pet maximum area.
 px(0,61,96,2,'#bbacb5');for(let i=0;i<7;i++)px((i*17+11)%95,60-(i%3),3,2,'#a8a2ae');
 if(S.egg){eggDraw();return;}
 if(!S.pet){eggDraw();return;}
 if(!S.pet.alive){px(27,46,42,2,'#937c94');px(45,28,6,14,'#967b99');px(41,28,14,3,'#967b99');pixelHeart(45,16,'#98718d');return;}
 if(LINK.state==='visit'&&window.PikoMotion){window.PikoMotion.cozy(ctx,frame,S,LINK,SPRITES);return;}
 if(LINK.state==='visit'&&LINK.role==='guest'){px(24,26,5,6,'#886188');px(38,18,5,6,'#886188');px(52,30,5,6,'#886188');pixelHeart(73,13,PINK);return;}
  const p=S.pet,im=SPRITES[p.species],baby=stage(p)==='Maluch';
 const side=LINK.state==='visit'&&LINK.role==='host'?39:(baby?52:stage(p)==='Senior'?60:58);
 const bounce=p.sleeping?0:Math.round(Math.sin(frame*.29)*1.1);
 const walking=window.PikoMotion?.step(p,side);
 const x=walking?.x??(LINK.state==='visit'&&LINK.role==='host'?6:Math.round((96-side)/2));
 const y=walking?.y??(Math.round((65-side)/2)+bounce);
 if(im?.complete&&im.naturalWidth){if(walking?.flip){ctx.save();ctx.translate(x+side,0);ctx.scale(-1,1);ctx.drawImage(im,0,y,side,side);ctx.restore();}else ctx.drawImage(im,x,y,side,side);}else{
  ctx.fillStyle='#a4cfac';ctx.fillRect(38,20,20,20);px(42,27,3,4,INK);px(51,27,3,4,INK);
 }
 if(LINK.state==='visit'&&LINK.role==='host'){const visitor=SPRITES[LINK.other?.species];if(visitor?.complete&&visitor.naturalWidth){ctx.drawImage(visitor,53,14,39,39);pixelHeart(46,5,PINK);}}
  if(p.sleeping){px(70,14,4,2,INK);px(75,9,5,2,INK);px(82,4,5,2,INK)}
 else if(p.sick){px(73,12,3,10,INK);px(73,25,3,3,INK)}
 else if(p.happy>75&&frame%22<13)pixelHeart(74,10,PINK);
 if(p.hunger<18&&!p.sleeping){px(16,22,2,8,INK);px(21,22,2,8,INK);px(16,32,8,2,INK)}
}
function route(where){switch(where){case 'visits':showVisits();break;case 'themes':showThemes();break;case 'collection':showCollection();break;case 'stats':showStats();break;case 'games':showGames();break;case 'shop':showShop();break;case 'bag':showBag();break;case 'tasks':showTasks();break;case 'achievements':showAchievements();break;case 'journal':showJournal();break;case 'settings':showSettings();break;case 'history':showHistory();break;case 'menu':showMenu();break;default:showMenu()}}
$('openSettings').addEventListener('click',()=>showSettings());$('openCollection').addEventListener('click',()=>showCollection());$('quickMenu').addEventListener('click',showMenu);$('quickStats').addEventListener('click',showStats);
$('prevBtn').addEventListener('click',()=>pushButton('prev'));$('nextBtn').addEventListener('click',()=>pushButton('next'));$('selectBtn').addEventListener('click',()=>pushButton('select'));
$('closeSheet').addEventListener('click',()=>hideSheet());$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hideSheet()});
$('lcdViewport').addEventListener('click',()=>{if(S.egg)eggTap();else if(S.pet?.alive){care('cuddle')}else if(!S.pet)showEggPicker();else showMemorial()});
['lcdTop','lcdBottom'].forEach(area=>$(area).addEventListener('click',e=>{const b=e.target.closest('[data-icon]');if(!b)return;const i=ACTIONS.findIndex(a=>a.id===b.dataset.icon);if(i>=0){selected=i;renderUI();doAction(ACTIONS[i].id)}}));
$('overlay').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.link){linkAction(b);return}
 if(b.dataset.egg){startEgg(b.dataset.egg);return}
 if(b.dataset.go){route(b.dataset.go);return}
 if(b.dataset.action){const cmd=b.dataset.action;if(cmd==='name')renamePet();else if(cmd==='nextlife')showEggPicker();else if(cmd==='close')(window.PikoNavigation?.close||hideSheet)();else if(cmd==='export')downloadSave();else if(cmd==='import')$('importFile')?.click();else if(cmd==='notifications')toggleNotifications();return}
 if(b.dataset.food){feed(b.dataset.food);return}
 if(b.dataset.theme!==undefined){changeTheme(Number(b.dataset.theme));return}
 if(b.dataset.toggle){S.settings[b.dataset.toggle]=!S.settings[b.dataset.toggle];save();showSettings();return}
 if(b.dataset.claim){claimTask(b.dataset.claim);return}
 if(b.dataset.buy){buyItem(b.dataset.buy);return}
 if(b.dataset.use){useItem(b.dataset.use);return}
 if(b.dataset.game){startGame(b.dataset.game);return}
 if(b.id==='starTarget'){catchStar();return}
 if(b.dataset.pad!==undefined){memoryTap(Number(b.dataset.pad));return}
 if(b.dataset.rps){playRps(b.dataset.rps);return}
 if(b.id==='reflexBtn'){reflexTap();return}
});
$('overlay').addEventListener('change',e=>{if(e.target.id==='importFile')importSave(e.target.files?.[0])});
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;if($('overlay').hidden){if(e.key==='ArrowLeft'||e.key==='a'){pushButton('prev');e.preventDefault()}else if(e.key==='ArrowRight'||e.key==='d'){pushButton('next');e.preventDefault()}else if(e.key==='Enter'||e.key===' '){pushButton('select');e.preventDefault()}}else if(e.key==='Escape'){hideSheet();e.preventDefault()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)simulate()});
window.addEventListener('pageshow',()=>simulate());
window.addEventListener('beforeunload',save);
syncVisitPet();
renderUI();draw();simulate();
if(S.pet&&!S.pet.alive)showMemorial();
setInterval(()=>{draw();if(gameSession?.kind==='catch'&&!gameSession.done&&$('gameScore')){const left=Math.max(0,12-Math.floor((Date.now()-gameSession.started)/1000));$('gameScore').innerHTML=`Punkty: <b>${gameSession.score}</b> · Czas: <b>${left}s</b>`;if(left<=0)finishGame(gameSession.score,'Czas minął!')}},170);
setInterval(()=>{renderUI();if(S.egg&&Date.now()>=S.egg.until){hatch()}},950);
setInterval(simulate,10000);
